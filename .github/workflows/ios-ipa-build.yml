name: iOS IPA Build

on:
  push:
    branches:
      - staging
      - main
      - "ai/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-ipa-build:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable signing for Pods targets
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          pods_project_path = 'ios/Pods/Pods.xcodeproj'
          project = Xcodeproj::Project.open(pods_project_path)

          project.build_configurations.each do |config|
            config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
            config.build_settings['CODE_SIGN_IDENTITY'] = ''
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ''
            config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = ''
            config.build_settings['PROVISIONING_PROFILE'] = ''
            config.build_settings['DEVELOPMENT_TEAM'] = ''
          end

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = ''
              config.build_settings['PROVISIONING_PROFILE'] = ''
              config.build_settings['DEVELOPMENT_TEAM'] = ''

              deployment_target = config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']
              if deployment_target && deployment_target.to_f < 12.0
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
              end
            end
          end

          target_attributes = project.root_object.attributes['TargetAttributes'] ||= {}
          project.targets.each do |target|
            target_attributes[target.uuid] ||= {}
            target_attributes[target.uuid]['ProvisioningStyle'] = 'Automatic'
          end

          project.save
          RUBY

      - name: Decode Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios_certificate.p12"

      - name: Verify decoded certificate file
        run: |
          ls -lh "$RUNNER_TEMP/ios_certificate.p12"
          shasum -a 256 "$RUNNER_TEMP/ios_certificate.p12"

      - name: Decode provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios_profile.mobileprovision"

      - name: Create temporary keychain and import certificate
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          security import "$RUNNER_TEMP/ios_certificate.p12" \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            build.keychain

      - name: Show available signing identities
        run: |
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms -D -i "$RUNNER_TEMP/ios_profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")

          cp "$RUNNER_TEMP/ios_profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

          echo "Installed provisioning profile:"
          echo "$PROFILE_NAME"
          echo "$PROFILE_UUID"

      - name: Configure main app signing only
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/FranchiseOS.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'FranchiseOS' }
          raise "FranchiseOS target not found" unless target

          target.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV['IOS_BUNDLE_ID']
            config.build_settings['DEVELOPMENT_TEAM'] = ENV['APPLE_TEAM_ID']
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['IOS_PROFILE_NAME']
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = ENV['IOS_PROFILE_NAME']
          end

          target_attributes = project.root_object.attributes['TargetAttributes'] ||= {}
          target_attributes[target.uuid] ||= {}
          target_attributes[target.uuid]['ProvisioningStyle'] = 'Manual'

          project.save
          RUBY

      - name: Validate and attach Firebase plist
        run: |
          test -f ios/FranchiseOS/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" ios/FranchiseOS/GoogleService-Info.plist

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/FranchiseOS.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'FranchiseOS' }
          raise "FranchiseOS target not found" unless target

          main_group = project.main_group

          file_ref = project.files.find { |f| f.path == 'FranchiseOS/GoogleService-Info.plist' }
          file_ref ||= main_group.new_file('FranchiseOS/GoogleService-Info.plist')

          resources_phase = target.resources_build_phase

          unless resources_phase.files_references.include?(file_ref)
            resources_phase.add_file_reference(file_ref, true)
          end

          project.save
          RUBY

      - name: Generate iOS app icons
        run: |
          test -f app-icon.png

          ICONSET_DIR="ios/FranchiseOS/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET_DIR"

          sips -z 40 40 app-icon.png --out "$ICONSET_DIR/Icon-20@2x.png"
          sips -z 60 60 app-icon.png --out "$ICONSET_DIR/Icon-20@3x.png"
          sips -z 58 58 app-icon.png --out "$ICONSET_DIR/Icon-29@2x.png"
          sips -z 87 87 app-icon.png --out "$ICONSET_DIR/Icon-29@3x.png"
          sips -z 80 80 app-icon.png --out "$ICONSET_DIR/Icon-40@2x.png"
          sips -z 120 120 app-icon.png --out "$ICONSET_DIR/Icon-40@3x.png"
          sips -z 120 120 app-icon.png --out "$ICONSET_DIR/Icon-60@2x.png"
          sips -z 180 180 app-icon.png --out "$ICONSET_DIR/Icon-60@3x.png"

          sips -z 20 20 app-icon.png --out "$ICONSET_DIR/Icon-20.png"
          sips -z 40 40 app-icon.png --out "$ICONSET_DIR/Icon-20-ipad@2x.png"
          sips -z 29 29 app-icon.png --out "$ICONSET_DIR/Icon-29.png"
          sips -z 58 58 app-icon.png --out "$ICONSET_DIR/Icon-29-ipad@2x.png"
          sips -z 40 40 app-icon.png --out "$ICONSET_DIR/Icon-40.png"
          sips -z 80 80 app-icon.png --out "$ICONSET_DIR/Icon-40-ipad@2x.png"
          sips -z 76 76 app-icon.png --out "$ICONSET_DIR/Icon-76.png"
          sips -z 152 152 app-icon.png --out "$ICONSET_DIR/Icon-76@2x.png"
          sips -z 167 167 app-icon.png --out "$ICONSET_DIR/Icon-83.5@2x.png"
          sips -z 1024 1024 app-icon.png --out "$ICONSET_DIR/Icon-1024.png"

          cat > "$ICONSET_DIR/Contents.json" <<'EOF'
          {
            "images": [
              { "idiom": "iphone", "size": "20x20", "scale": "2x", "filename": "Icon-20@2x.png" },
              { "idiom": "iphone", "size": "20x20", "scale": "3x", "filename": "Icon-20@3x.png" },
              { "idiom": "iphone", "size": "29x29", "scale": "2x", "filename": "Icon-29@2x.png" },
              { "idiom": "iphone", "size": "29x29", "scale": "3x", "filename": "Icon-29@3x.png" },
              { "idiom": "iphone", "size": "40x40", "scale": "2x", "filename": "Icon-40@2x.png" },
              { "idiom": "iphone", "size": "40x40", "scale": "3x", "filename": "Icon-40@3x.png" },
              { "idiom": "iphone", "size": "60x60", "scale": "2x", "filename": "Icon-60@2x.png" },
              { "idiom": "iphone", "size": "60x60", "scale": "3x", "filename": "Icon-60@3x.png" },

              { "idiom": "ipad", "size": "20x20", "scale": "1x", "filename": "Icon-20.png" },
              { "idiom": "ipad", "size": "20x20", "scale": "2x", "filename": "Icon-20-ipad@2x.png" },
              { "idiom": "ipad", "size": "29x29", "scale": "1x", "filename": "Icon-29.png" },
              { "idiom": "ipad", "size": "29x29", "scale": "2x", "filename": "Icon-29-ipad@2x.png" },
              { "idiom": "ipad", "size": "40x40", "scale": "1x", "filename": "Icon-40.png" },
              { "idiom": "ipad", "size": "40x40", "scale": "2x", "filename": "Icon-40-ipad@2x.png" },
              { "idiom": "ipad", "size": "76x76", "scale": "1x", "filename": "Icon-76.png" },
              { "idiom": "ipad", "size": "76x76", "scale": "2x", "filename": "Icon-76@2x.png" },
              { "idiom": "ipad", "size": "83.5x83.5", "scale": "2x", "filename": "Icon-83.5@2x.png" },

              { "idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "Icon-1024.png" }
            ],
            "info": {
              "version": 1,
              "author": "xcode"
            }
          }
          EOF

          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" ios/FranchiseOS/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" ios/FranchiseOS/Info.plist

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/FranchiseOS.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'FranchiseOS' }
          raise "FranchiseOS target not found" unless target

          target.build_configurations.each do |config|
            config.build_settings['ASSETCATALOG_COMPILER_APPICON_NAME'] = 'AppIcon'
          end

          project.save
          RUBY

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.IOS_BUNDLE_ID }}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: List Xcode schemes
        run: |
          cd ios
          xcodebuild -list -workspace FranchiseOS.xcworkspace

      - name: Archive iOS app
        run: |
          cd ios
          xcodebuild archive \
            -workspace FranchiseOS.xcworkspace \
            -scheme FranchiseOS \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FranchiseOS.xcarchive" \
            -destination "generic/platform=iOS"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FranchiseOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: franchiseos-ios-ipa
          path: ${{ runner.temp }}/ipa-export/*.ipa

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          mkdir -p "$HOME/.private_keys"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p "$GITHUB_WORKSPACE/private_keys"

          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          cp "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$GITHUB_WORKSPACE/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          chmod 600 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$GITHUB_WORKSPACE/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          IPA_PATH=$(find "$RUNNER_TEMP/ipa-export" -name "*.ipa" | head -n 1)

          echo "Uploading IPA to TestFlight:"
          echo "$IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
